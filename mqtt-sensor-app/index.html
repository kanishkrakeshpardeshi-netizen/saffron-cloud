<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Environmental Sensor Dashboard</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="dashboard-container">
      <header>
        <h1>Environmental Monitor</h1>
        <div class="status-indicator">
          <span id="connection-status" class="status-badge disconnected">Disconnected</span>
        </div>
      </header>

      <main class="grid-layout">
        <div class="card glass-effect">
          <div class="card-icon temp-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
          </div>
          <h2>Temperature</h2>
          <div class="value-display">
            <span id="temp-value">--</span>
            <span class="unit">°C</span>
          </div>
          <p class="last-updated">Waiting for data...</p>
        </div>

        <div class="card glass-effect">
          <div class="card-icon humidity-icon">
             <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
          </div>
          <h2>Humidity</h2>
          <div class="value-display">
            <span id="humidity-value">--</span>
            <span class="unit">%</span>
          </div>
          <p class="last-updated">Waiting for data...</p>
        </div>

        <div class="card glass-effect">
          <div class="card-icon air-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path></svg>
          </div>
          <h2>Air Quality (AQI)</h2>
          <div class="value-display">
            <span id="aqi-value">--</span>
            <span class="unit">Idx</span>
          </div>
          <p class="last-updated">Waiting for data...</p>
        </div>
      </main>

      <div class="log-section glass-effect">
         <h3>Recent Events</h3>
         <div class="log-container" id="log-container">
           <!-- Logs dynamically appended here -->
         </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
